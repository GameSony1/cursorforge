appId: com.gamesony.cursorforge
productName: CursorForge
electronVersion: 32.3.3
npmRebuild: false
directories:
  output: release
files:
  - out/**/*
  - package.json
asarUnpack:
  - '**/node_modules/koffi/**'
  - '**/node_modules/@koromix/**'
  - '**/node_modules/uiohook-napi/**'
win:
  executableName: CursorForge
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: GameSony1
  repo: cursorforge
